<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản lý OEM</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>Quản lý bán hàng & mã OEM thay thế</h1>

      <nav class="tabs">
        <button class="tab-btn active" data-tab="overview">Tổng quan</button>
        <button class="tab-btn" data-tab="sales">Bán hàng</button>
        <button class="tab-btn" data-tab="inventory">Nhập hàng</button>
        <button class="tab-btn" data-tab="history">Lịch sử bán</button>
      </nav>

      <section id="overview" class="tab-panel active">
        <h2>Gợi ý tìm mã OEM thay thế</h2>
        <label for="oemSearch">Nhập mã OEM</label>
        <input id="oemSearch" type="text" placeholder="Ví dụ: 06A905115D" />
        <div id="overviewResults" class="cards"></div>
      </section>

      <section id="sales" class="tab-panel">
        <h2>Tạo đơn bán hàng (nhiều sản phẩm/đơn)</h2>
        <div id="salesProductList" class="sales-list"></div>
        <button id="saveOrderBtn" class="primary">Lưu đơn hàng</button>
        <p id="salesMessage" class="message"></p>
      </section>

      <section id="inventory" class="tab-panel">
        <h2>Nhập hàng & khai báo nhiều mã OEM thay thế</h2>
        <form id="inventoryForm" class="stack">
          <label>Mã sản phẩm
            <input id="productCode" required placeholder="VD: SP-001" />
          </label>
          <label>Tên sản phẩm
            <input id="productName" required placeholder="VD: Bugi đánh lửa" />
          </label>
          <label>Ảnh sản phẩm (URL)
            <input id="productImage" required type="url" placeholder="https://..." />
          </label>

          <div>
            <div class="inline-between">
              <span>Các mã OEM thay thế</span>
              <button type="button" id="addOemFieldBtn">+ Thêm mã</button>
            </div>
            <div id="oemFields" class="stack compact"></div>
          </div>

          <button type="submit" class="primary">Lưu sản phẩm</button>
          <p id="inventoryMessage" class="message"></p>
        </form>
      </section>

      <section id="history" class="tab-panel">
        <h2>Lịch sử bán hàng</h2>
        <div id="historyList" class="stack"></div>
      </section>
    </main>

    <div id="imagePopup" class="popup hidden" role="dialog" aria-modal="true">
      <div class="popup-square">
        <button id="closePopup" class="close-btn" aria-label="Đóng">×</button>
        <img id="popupImage" src="" alt="Ảnh sản phẩm" class="oval-image" />
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
